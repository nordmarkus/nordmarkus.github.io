<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wind Data Arendal Airport</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 2em auto;
      text-align: center;
    }
    #wind-direction-arrow {
      width: 50px;
      height: 50px;
      margin: 1em auto;
      transition: transform 0.5s ease;
    }
    .value {
      font-size: 1.5em;
      margin: 0.5em 0;
    }
    .label {
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Wind Data - Arendal Airport</h1>
  <div>
    <svg id="wind-direction-arrow" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" >
      <polygon points="50,5 70,90 50,70 30,90" fill="#0077cc"/>
    </svg>
  </div>
  <div>
    <div><span class="label">Wind Direction (°):</span> <span id="wind-direction">--</span></div>
    <div><span class="label">Wind Speed (m/s):</span> <span id="wind-speed">--</span></div>
    <div><span class="label">Wind Gust (m/s):</span> <span id="wind-gust">--</span></div>
    <div><small id="last-updated"></small></div>
  </div>

  <script>
    const clientId = '22311325-d113-4d52-bdf4-c95f275ed015';
    const clientSecret = '3b62c5c5-43ac-4eab-b433-c3c2e3ca8413';

    async function fetchWindData() {
      const url = 'https://frost.met.no/observations/v0.jsonld?sources=SN18710&elements=wind_speed,wind_from_direction,wind_speed_of_gust';

      const headers = new Headers();
      headers.append('Authorization', 'Basic ' + btoa(clientId + ':' + clientSecret));
      headers.append('Accept', 'application/json');

      try {
        const response = await fetch(url, { headers });
        if (!response.ok) {
          throw new Error('HTTP error ' + response.status);
        }
        const data = await response.json();
        const observations = data['data'];

        if(observations.length === 0) {
          throw new Error('No data received');
        }

        // Find latest observation timestamps and values for needed elements
        // Example JSON structure might have multiple observations; pick latest per element
        const windSpeed = observations.find(o => o.observedProperty.id === 'wind_speed');
        const windDir = observations.find(o => o.observedProperty.id === 'wind_from_direction');
        const windGust = observations.find(o => o.observedProperty.id === 'wind_speed_of_gust');

        // Get the latest result value from each
        const getLatestValue = (obs) => {
          if(!obs || !obs.observations) return null;
          const latestObs = obs.observations.reduce((a, b) => (a.referenceTime > b.referenceTime ? a : b));
          return latestObs.result.value;
        };

        const windSpeedValue = getLatestValue(windSpeed);
        const windDirValue = getLatestValue(windDir);
        const windGustValue = getLatestValue(windGust);

        document.getElementById('wind-speed').textContent = windSpeedValue !== null ? windSpeedValue.toFixed(1) : '--';
        document.getElementById('wind-direction').textContent = windDirValue !== null ? windDirValue.toFixed(0) : '--';
        document.getElementById('wind-gust').textContent = windGustValue !== null ? windGustValue.toFixed(1) : '--';

        if (windDirValue !== null) {
          // Rotate arrow so it points to the wind direction
          document.getElementById('wind-direction-arrow').style.transform = `rotate(${windDirValue}deg)`;
        }

        const nowIso = new Date().toISOString();
        document.getElementById('last-updated').textContent = `Last updated: ${nowIso}`;

      } catch (err) {
        console.error('Failed to fetch wind data:', err);
        document.getElementById('wind-speed').textContent = '--';
        document.getElementById('wind-direction').textContent = '--';
        document.getElementById('wind-gust').textContent = '--';
        document.getElementById('last-updated').textContent = 'Failed to load data';
      }
    }

    fetchWindData();
    // Refresh every 10 minutes
    setInterval(fetchWindData, 600000);
  </script>
</body>
</html>
