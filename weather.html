<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vind – modell (uten ID)</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:#0f172a; color:#e5e7eb; }
    .wrap { max-width: 900px; margin: 24px auto; padding: 0 16px 40px; }
    header { display:flex; gap:16px; align-items:baseline; }
    h1 { font-size:1.3rem; margin:0; }
    .meta { color:#9ca3af; }
    .card { margin-top:16px; background:#0b1220; border:1px solid #1f2937; border-radius:12px; padding:16px; }
    .grid { display:grid; grid-template-columns: auto 1fr; gap:16px; align-items:center; }
    .compass { width:90px; height:90px; background: radial-gradient(circle at 50% 50%, #0e1830, #0b1220 60%); border:1px solid #1f2937; border-radius:50%; position:relative; }
    .compass::before { content:"N"; position:absolute; top:6px; left:50%; transform:translateX(-50%); color:#9ca3af; font-size:12px; }
    .needle { position:absolute; left:50%; top:50%; width:2px; height:38px; background:#60a5fa; transform-origin: bottom center; transform: translate(-50%, -100%) rotate(0deg); border-radius:2px; box-shadow: 0 0 8px rgba(96,165,250,.7); }
    .center-dot { position:absolute; left:50%; top:50%; width:8px; height:8px; border-radius:50%; transform:translate(-50%,-50%); background:#93c5fd; }
    .vals { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px; }
    .kv { background:#0d172a99; border:1px solid #1f2937; border-radius:10px; padding:10px 12px; }
    .kv .k { color:#9ca3af; font-size:.85rem; margin-bottom:4px; }
    .kv .v { font-size:1.4rem; line-height:1.2; }
    .kv .v .unit { color:#9ca3af; font-size:.9rem; margin-left:6px; }
    .error { margin-top:8px; color:#fecaca; }
    .foot { margin-top:10px; color:#9ca3af; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Vind – modell (siste time)</h1>
      <div class="meta">Kilde: api.met.no Locationforecast 2.0 (ingen ID kreves)</div>
    </header>

    <section class="card">
      <div class="grid">
        <div class="compass">
          <div id="needle" class="needle"></div>
          <div class="center-dot"></div>
        </div>
        <div class="vals">
          <div class="kv">
            <div class="k">Retning</div>
            <div class="v"><span id="dir-deg">–</span> <span class="unit">°</span></div>
            <div class="foot" id="dir-card">–</div>
          </div>
          <div class="kv">
            <div class="k">Vind</div>
            <div class="v"><span id="spd">–</span> <span class="unit">m/s</span></div>
            <div class="foot" id="ts">–</div>
          </div>
          <div class="kv">
            <div class="k">Kast (modell)</div>
            <div class="v"><span id="gust">–</span> <span class="unit">m/s</span></div>
            <div class="foot">Beregnet</div>
          </div>
        </div>
      </div>
      <div id="err" class="error" style="display:none;"></div>
      <div class="foot">Bruk enkel CORS og identifiser med User-Agent i fetch; api.met.no anbefaler dette for klienter uten backend. [retningslinjer] [web:55][web:28]</div>
    </section>
  </div>

  <script>
    // Set the station coordinates; example values must be updated to SN36330 lat/lon.
    const LAT = 58.4600;   // TODO: set actual
    const LON = 8.7720;    // TODO: set actual
    const API = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${LAT.toFixed(4)}&lon=${LON.toFixed(4)}`;

    const needle = document.getElementById("needle");
    const dirDegEl = document.getElementById("dir-deg");
    const dirCardEl = document.getElementById("dir-card");
    const spdEl = document.getElementById("spd");
    const gustEl = document.getElementById("gust");
    const tsEl = document.getElementById("ts");
    const errEl = document.getElementById("err");

    function degToCardinal(deg) {
      if (deg == null || isNaN(deg)) return "–";
      const dirs = ["N","NØ","Ø","SØ","S","SV","V","NV","N"];
      return dirs[Math.round(deg / 45) % 8];
    }
    function nice(value, dp=1) { return (value==null||isNaN(value)) ? "–" : Number(value).toFixed(dp); }
    function formatTs(iso) { try { return new Date(iso).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }); } catch { return iso; } }

    async function load() {
      try {
        errEl.style.display = "none";
        const res = await fetch(API, {
          method: "GET",
          headers: {
            // User-Agent cannot be set by browsers; use 'Referer' and default UA. API allows simple CORS without custom headers. [web:55][web:28]
          },
          cache: "no-store"
        });
        if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
        const json = await res.json();

        const ts = json?.properties?.timeseries;
        if (!Array.isArray(ts) || !ts.length) throw new Error("Ingen data");
        const now = ts[0]; // first element is the nearest valid time
        const time = now.time || now?.data?.instant?.details?.time;

        // Wind details: instant.details has wind_speed and wind_from_direction. [web:56]
        const inst = now.data?.instant?.details || {};
        const sixh = now.data?.next_1_hours?.details || now.data?.next_6_hours?.details || {};
        const spd = inst.wind_speed;
        const dir = inst.wind_from_direction;
        // Gusts not always provided; sometimes next_1_hours contains wind_speed_of_gust. [web:56]
        const gust = sixh.wind_speed_of_gust ?? inst.wind_speed_of_gust;

        dirDegEl.textContent = nice(dir, 0);
        dirCardEl.textContent = degToCardinal(dir);
        spdEl.textContent = nice(spd, 1);
        gustEl.textContent = gust == null ? "–" : nice(gust, 1);
        tsEl.textContent = "Kl " + formatTs(time);

        if (!isNaN(Number(dir))) {
          needle.style.transform = `translate(-50%, -100%) rotate(${Number(dir)}deg)`;
        }
      } catch (e) {
        errEl.style.display = "block";
        errEl.textContent = "Feil ved henting av modell-data: " + (e?.message || e);
      }
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
