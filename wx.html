<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Frost API Wind Data SN36330 with CORS Proxy</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; background: #fafbfc; color: #222; }
    h2 { color: #1762A7; }
    #wind-data { margin-top: 2em; }
    .label { font-weight: bold; }
  </style>
</head>
<body>
  <h2>Wind Data – SN36330 Arendal Lufthavn (Frost API + CORS Proxy)</h2>
  <div id="wind-data"><p>Fetching...</p></div>
  <script>
    const clientId = 'ed077068-5080-4a01-9fc8-dced14d78b4e';
    const clientSecret = '9f954f85-9705-4a15-879b-a3ac2a526d2b';
    const basicAuth = btoa(`${clientId}:${clientSecret}`);

    async function fetchWind() {
      const corsProxy = 'https://cors-anywhere.herokuapp.com/';
      const apiUrl = 'https://frost.met.no/observations/v0.jsonld?sources=SN36330&elements=wind_speed,wind_from_direction,wind_speed_of_gust&referencetime=latest';
      const url = corsProxy + apiUrl;

      try {
        const response = await fetch(url, {
          headers: {
            'Authorization': 'Basic ' + basicAuth,
            'Accept': 'application/json'
          }
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const data = await response.json();
        const observations = data.data || [];
        const obsMap = {};
        for (const obs of observations) {
          if (obs.elementId && obs.value !== undefined) {
            obsMap[obs.elementId] = obs.value;
          }
        }

        const windSpeed = obsMap['wind_speed'] ?? 'N/A';
        const windGust = obsMap['wind_speed_of_gust'] ?? 'N/A';
        const windDirection = obsMap['wind_from_direction'] ?? 'N/A';

        document.getElementById('wind-data').innerHTML =
          `<div><span class="label">Wind speed:</span> ${windSpeed} m/s</div>
           <div><span class="label">Wind gust:</span> ${windGust} m/s</div>
           <div><span class="label">Wind direction:</span> ${windDirection}&deg;</div>
           <div>Last updated: <span>${new Date().toLocaleTimeString()}</span></div>`;

      } catch (error) {
        document.getElementById('wind-data').innerHTML = `<p>Error fetching wind data: ${error.message}</p>`;
      }
    }

    fetchWind();
    setInterval(fetchWind, 60000);
  </script>
</body>
</html>
