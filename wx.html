<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENGK Winds</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #0078d7;
      user-select: none;
    }
    .wind-container {
      display: flex;
      align-items: center;
      gap: 2rem;
      background: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      max-width: 420px;
      width: 100%;
      justify-content: space-around;
    }
    .wind-info {
      font-size: 1.25rem;
      user-select: none;
    }
    .wind-info strong {
      font-weight: 600;
      color: #005a9e;
      display: inline-block;
      min-width: 130px;
    }
    .wind-arrow {
      width: 80px;
      height: 80px;
      transition: transform 0.5s ease;
      user-select: none;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.15));
    }
    .timestamp {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #555;
      user-select: none;
    }
  </style>
</head>
<body>
  <h1>ENGK Winds</h1>
  <div class="wind-container">
    <svg class="wind-arrow" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,0 40,16 35,16 35,56 29,56 29,16 24,16" fill="#0078d7"/>
      <circle cx="32" cy="32" r="30" stroke="#0078d7" stroke-width="2" fill="none"/>
    </svg>
    <div>
      <div class="wind-info"><strong>Wind speed:</strong><span id="wind-speed">--</span> m/s</div>
      <div class="wind-info"><strong>Wind gust:</strong><span id="wind-gust">--</span> m/s</div>
      <div class="wind-info"><strong>Wind direction:</strong><span id="wind-direction">--</span>°</div>
    </div>
  </div>
  <div class="timestamp" id="timestamp">Last updated: --:--:--</div>

  <script>
    // Example function to update wind info and arrow rotation
    // Replace with real data integration later
    function updateWind(speed, gust, direction, time) {
      document.getElementById('wind-speed').textContent = speed;
      document.getElementById('wind-gust').textContent = gust;
      document.getElementById('wind-direction').textContent = direction;
      document.getElementById('timestamp').textContent = 'Last updated: ' + time;

      const arrow = document.querySelector('.wind-arrow');
      // Rotate arrow to point in wind direction (0° = north)
      arrow.style.transform = `rotate(${direction}deg)`;
    }

    // Demo update with dummy data and current time
    function demoUpdate() {
      const now = new Date().toLocaleTimeString();
      updateWind(6.5, 10.1, 135, now);
    }

    demoUpdate();
  </script>
</body>
</html>
