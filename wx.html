<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wind Data SN36330 - Arendal Lufthavn</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; background: #fafbfc; color: #222; }
    h2 { color: #1762A7; }
    #wind-data { margin-top: 2em; }
    .label { font-weight: bold; }
  </style>
</head>
<body>
  <h2>Wind Data – SN36330 Arendal Lufthavn</h2>
  <div id="wind-data">
    <p>Fetching...</p>
  </div>
  <script>
    async function fetchWind() {
      const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
      const apiUrl = 'https://seklima.met.no/minutes/wind_from_direction,wind_speed,max(wind_speed_of_gust%20PT10M)/last_hour/SN36330/nb/';
      const url = proxyUrl + apiUrl;

      try {
        const response = await fetch(url, {
          headers: {
            'User-Agent': 'WindDataDemo/1.0 https://github.com/'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const csvText = await response.text();
        const lines = csvText.trim().split('\n');

        const headers = lines[0].split(',');
        console.log('CSV Headers:', headers);  // Check the exact header names here

        const lastLine = lines[lines.length - 1].split(',');

        // Update these once you confirm header names from the console output
        const windDirHeader = 'wind_from_direction';
        const windSpeedHeader = 'wind_speed';
        const windGustHeader = 'max_wind_speed_of_gust_PT10M';

        const windDirIdx = headers.indexOf(windDirHeader);
        const windSpeedIdx = headers.indexOf(windSpeedHeader);
        const windGustIdx = headers.indexOf(windGustHeader);

        const windDirection = windDirIdx !== -1 ? lastLine[windDirIdx] : 'N/A';
        const windSpeed = windSpeedIdx !== -1 ? lastLine[windSpeedIdx] : 'N/A';
        const windGust = windGustIdx !== -1 ? lastLine[windGustIdx] : 'N/A';

        document.getElementById('wind-data').innerHTML =
          `<div><span class="label">Wind speed:</span> ${windSpeed} m/s</div>
           <div><span class="label">Wind gust:</span> ${windGust} m/s</div>
           <div><span class="label">Wind direction:</span> ${windDirection}&deg;</div>
           <div>Last updated: <span id="update-time">${new Date().toLocaleTimeString()}</span></div>`;

      } catch (error) {
        document.getElementById('wind-data').innerHTML = `<p>Error fetching wind data: ${error.message}</p>`;
      }
    }

    fetchWind();
    setInterval(fetchWind, 60000); // Refresh every 60 seconds
  </script>
</body>
</html>
