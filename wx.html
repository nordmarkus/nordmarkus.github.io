<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ENGK Winds</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: 'Consolas', 'Courier New', monospace;
      background: radial-gradient(circle at center, #0a1a0a 0%, #010503 80%);
      color: #a1ff9e;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 8px #4dff4d, 0 0 15px #00ff00;
      letter-spacing: 3px;
    }
    .wind-container {
      background: #031103;
      border: 2px solid #05ff00;
      border-radius: 14px;
      padding: 2rem 3rem;
      box-shadow: 0 0 15px #00ff00aa inset;
      max-width: 440px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 2rem;
    }
    .wind-info {
      font-size: 1.3rem;
    }
    .wind-info strong {
      display: inline-block;
      min-width: 140px;
      color: #ff7f50;
      text-shadow: 0 0 5px #ff7f50aa;
    }
    .wind-arrow {
      width: 100px;
      height: 100px;
      user-select: none;
      filter: drop-shadow(0 0 6px #05ff00aa);
      transition: transform 0.5s ease;
      position: relative;
    }
    .wind-arrow circle {
      stroke: #05ff00;
      stroke-width: 2;
      fill: none;
    }
    .wind-arrow polygon {
      fill: #05ff00;
      filter: drop-shadow(0 0 10px #00ff00);
    }
    .radar-sweep {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0,255,0,0.15) 0%, transparent 60%);
      animation: sweep 4s linear infinite;
      pointer-events: none;
      mix-blend-mode: screen;
      transform-origin: center;
      z-index: 1;
    }
    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .timestamp {
      margin-top: 1.8rem;
      font-size: 1rem;
      color: #7aff7a;
      text-shadow: 0 0 5px #007700;
    }
  </style>
</head>
<body>
  <h1>ENGK WINDS</h1>

  <div class="wind-container">
    <div class="wind-arrow" aria-hidden="true" role="presentation">
      <svg viewBox="0 0 64 64" width="100" height="100" xmlns="http://www.w3.org/2000/svg" style="position: relative; z-index: 2;">
        <circle cx="32" cy="32" r="30" />
        <polygon points="32,6 38,26 32,20 26,26" />
      </svg>
      <div class="radar-sweep"></div>
    </div>
    <div>
      <div class="wind-info"><strong>Wind speed:</strong> <span id="wind-speed">--</span> m/s</div>
      <div class="wind-info"><strong>Wind gust:</strong> <span id="wind-gust">--</span> m/s</div>
      <div class="wind-info"><strong>Wind direction:</strong> <span id="wind-direction">--</span>°</div>
    </div>
  </div>

  <div class="timestamp" id="timestamp">Last updated: --:--:--</div>

<script>
  function updateWind(speed, gust, direction, time) {
    document.getElementById('wind-speed').textContent = speed;
    document.getElementById('wind-gust').textContent = gust;
    document.getElementById('wind-direction').textContent = direction;
    document.getElementById('timestamp').textContent = 'Last updated: ' + time;

    const arrow = document.querySelector('.wind-arrow svg');
    arrow.style.transform = `rotate(${direction}deg)`;
  }
  // Demo with placeholder data
  function demoUpdate() {
    const now = new Date().toLocaleTimeString();
    updateWind(7.4, 12.3, 275, now);
  }
  demoUpdate();
</script>
</body>
</html>
